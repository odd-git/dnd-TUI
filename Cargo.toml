[package]
name = "dnd-tui"
version = "0.9.4"
edition = "2021"
description = "Terminal character sheets for D&D 5e (2014 rules) sessions"
license = "GPL-3.0-or-later"
repository = "https://github.com/odd-git/dnd-TUI"

[dependencies]
ratatui = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"

# crossterm does not build for wasm32: the browser build runs on ratzilla instead
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ratatui = { version = "0.29", features = ["crossterm", "underline-color"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ratzilla = "0.2"
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Storage", "KeyboardEvent", "MouseEvent", "WheelEvent", "Event", "EventTarget", "Blob", "Url", "HtmlAnchorElement", "HtmlInputElement", "FileReader", "FileList", "File"] }

[profile.release]
debug = "line-tables-only" # file:line in crash.log backtraces
